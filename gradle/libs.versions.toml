[versions]
agp = "8.7.3"
kotlin = "2.0.21"
coroutines = "1.9.0"
protobuf = "3.25.5"
protobufPlugin = "0.9.4"
junit = "5.11.3"
vosk = "0.3.45"
# Pinned to what vosk-android:0.3.45 declares, deliberately -- see app/build.gradle.kts.
jna = "4.4.0"
androidxCore = "1.15.0"
androidxAppcompat = "1.7.0"
androidxCarApp = "1.7.0"

[libraries]
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

protobuf-javalite = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobuf" }
protobuf-protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf" }

vosk = { module = "com.alphacephei:vosk", version.ref = "vosk" }
# JNA's native dispatcher, as an AAR rather than the plain jar vosk-android's
# POM asks for. Same coordinates, same version, so nothing about the Java API
# vosk-android was compiled against changes -- only the packaging. See the
# comment beside it in app/build.gradle.kts for why that is the whole fix.
jna-aar = { module = "net.java.dev.jna:jna", version.ref = "jna" }
# The Android build of the same decoder. It exports the identical org.vosk
# classes plus an android package, which is what makes core-voice able to
# compile against the desktop jar and run against this one.
vosk-android = { module = "com.alphacephei:vosk-android", version.ref = "vosk" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.11.3" }
# A real org.json for :app unit tests. The Android SDK jar on the unit-test
# classpath stubs every org.json method to throw, so a test touching a saved
# dashboard layout would die on JSONObject without this.
json = { module = "org.json:json", version = "20240303" }

androidx-test-runner = { module = "androidx.test:runner", version = "1.6.2" }
androidx-test-core = { module = "androidx.test:core", version = "1.6.1" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version = "1.2.1" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }

# The Android for Cars App Library. Headway is the *host* side of it, which is
# the side Google never published a host for -- but the AAR ships every piece a
# host needs as public API: the ICarApp/ICarHost/IAppHost AIDL stubs, the
# Bundler wire format, and the whole template model with public getters. See
# docs/adr/0007-headway-as-a-car-app-host.md for why this is a
# dependency and not a fork. Apache-2.0, one-way compatible with GPLv3, and
# free of Play Services -- `checkNoGms` covers it like everything else.
androidx-car-app = { module = "androidx.car.app:app", version.ref = "androidxCarApp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
