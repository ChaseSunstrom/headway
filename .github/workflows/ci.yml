name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# The whole protocol stack is pure JVM (ADR 0001), so the gates that matter most
# run on a stock runner with no Android SDK, no emulator and no device.
jobs:
  protocol:
    name: Protocol core (unit + byte fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests — framing, crypto, channels, transport
        run: ./gradlew :core-protocol:test :core-transport:test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-test-reports
          path: |
            core-protocol/build/reports/tests/
            core-transport/build/reports/tests/
          retention-days: 14

  acceptance:
    name: Phase acceptance (vs head-unit emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      # Each phase's criterion from CLAUDE.md is encoded as a test here. A phase
      # is not Done until its test is green.
      - name: Phase 1-4 acceptance suite
        run: ./gradlew :headunit-emulator:test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-test-reports
          path: headunit-emulator/build/reports/tests/
          retention-days: 14

  voice:
    name: Phase 5 voice (real Vosk model, real speech)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      # The model is 68 MB unpacked and is not committed. Without it the Phase 5
      # test skips; CI fetches it so CI actually runs it.
      - name: Cache the Vosk model
        id: vosk-cache
        uses: actions/cache@v4
        with:
          path: /opt/vosk
          key: vosk-model-small-en-us-0.15

      - name: Fetch the Vosk model
        if: steps.vosk-cache.outputs.cache-hit != 'true'
        run: ./tools/fetch-vosk-model.sh

      # Runs real speech fixtures through the real recogniser and asserts both
      # the resolved command and the sub-2s budget.
      - name: Voice pipeline acceptance
        run: ./gradlew :core-voice:test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-test-reports
          path: core-voice/build/reports/tests/
          retention-days: 14

  android:
    name: Android build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      # Both variants. They differ only in two manifest declarations, but the
      # one that is easy to break is `compat` -- nothing else in the build
      # references it, so a merge error there would be invisible until somebody
      # who needs it tried to install one.
      - name: Assemble both debug APKs
        env:
          HEADWAY_BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew :app:assembleHostDebug :app:assembleCompatDebug

      # The one property the variants exist for, checked on the built APKs
      # rather than on the intent. Both ways of getting it wrong are silent:
      # claims left in `compat` make the fallback uninstallable on exactly the
      # phones it is for, and claims missing from `host` disable the car-app
      # host with no error anywhere.
      - name: The two APKs claim what they should
        run: ./tools/check-install-claims.sh

      # The variants share every line of Kotlin, so running the suite twice
      # would buy nothing; `host` is the default and the one people install.
      - name: Android module unit tests
        run: ./gradlew :core-video:test :core-input:test :core-audio:test :app:testHostDebugUnitTest

      # Both variants, named explicitly. A `*/debug/*.apk` glob would also sweep
      # up app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk,
      # and handing somebody a test harness APK to sideload alongside the two
      # real ones is a good way to waste an evening.
      - uses: actions/upload-artifact@v4
        with:
          name: headway-debug-apk
          path: |
            app/build/outputs/apk/host/debug/app-host-debug.apk
            app/build/outputs/apk/compat/debug/app-compat-debug.apk
          retention-days: 14

  instrumented:
    name: Android instrumented tests (AOSP emulator, no GMS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      # KVM is what makes this affordable; without it the emulator is unusably
      # slow. GitHub's ubuntu-latest runners expose it once the udev rule is set.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # aosp_atd carries zero Google Play Services, which matches the project's
      # no-GMS constraint rather than merely tolerating it.
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # Two properties, both load-bearing.
          #
          # headway.abis: published APKs are arm64-only, because Vosk's
          # libvosk.so is ~9 MB per ABI and minSdk 33 stores it uncompressed.
          # This emulator is x86_64, and an APK with no matching ABI is rejected
          # outright — "Found 1 connected device(s), 0 of which were compatible"
          # — before a single test runs. The library modules pass on the same
          # emulator because they carry no native code; only :app does.
          #
          # headway.model: nothing instrumented needs the speech model, and
          # skipping it saves a 41 MB download on every run.
          #
          # Every module is named explicitly now that :app has flavours. The
          # bare `connectedDebugAndroidTest` would run BOTH app variants, which
          # doubles a four-minute emulator job to test one manifest difference;
          # but `connectedHostDebugAndroidTest` alone would silently run only
          # :app, because Gradle's name matching skips projects that lack the
          # task and the three library modules have no flavours. Losing their
          # instrumented tests without a single line of output is exactly the
          # kind of quiet coverage hole worth spelling out against.
          script: >-
            ./gradlew
            :app:connectedHostDebugAndroidTest
            :core-audio:connectedDebugAndroidTest
            :core-input:connectedDebugAndroidTest
            :core-video:connectedDebugAndroidTest
            -Pheadway.abis=arm64-v8a,x86_64
            -Pheadway.model=none

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-test-reports
          path: "*/build/reports/androidTests/"
          retention-days: 14

  constraints:
    name: Hard constraints from CLAUDE.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      # No Google Play Services anywhere in the merged dependency graph.
      - name: No GMS
        run: ./gradlew checkNoGms

      - name: GPLv3 headers on every source file
        run: ./tools/check-license-headers.sh

      # "Every TODO left in code must have a matching entry in BLOCKERS.md."
      - name: Every TODO is tracked
        run: ./tools/check-todos.sh

  release:
    name: Publish the APK as a release
    # Only after every gate above is green. Shipping a build whose protocol
    # tests failed would defeat the point of having them.
    needs: [protocol, acceptance, voice, android, instrumented, constraints]
    # Pushes to the default branch, or a manual run of this workflow on any
    # branch. A pull request must not publish, and neither should an ordinary
    # push to a feature branch -- otherwise every experiment mints a tag.
    #
    # The manual escape exists because the APK now carries a bundled 41 MB
    # speech model and no longer fits down the channels a test build used to be
    # handed over. A release is the delivery mechanism, and it is also the one
    # the in-app updater already reads.
    if: >-
      (github.event_name == 'push' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      # HEADWAY_BUILD_NUMBER becomes the APK's versionCode. It has to match the
      # build number in the tag, because the in-app updater compares tags and
      # Android compares versionCodes, and an update where those two disagree
      # either never gets offered or gets refused as a downgrade.
      - name: Assemble both APKs
        env:
          HEADWAY_BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew :app:assembleHostDebug :app:assembleCompatDebug

      - name: Name the artifacts after what they actually are
        id: name
        run: |
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          sha=$(git rev-parse --short HEAD)
          # A dot before the run number would read as a version segment; a dash
          # keeps the build identifier visibly separate from the version.
          #
          # The variant is the LAST segment before .apk on purpose:
          # ReleaseCatalog.chooseApk matches on the "-host.apk"/"-compat.apk"
          # suffix so an update keeps the variant it started on. Renaming these
          # without changing that function silently sends every updater down the
          # single-APK fallback.
          echo "tag=v${version}-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "stem=headway-${version}-build${{ github.run_number }}-${sha}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Stage both APKs
        run: |
          cp app/build/outputs/apk/host/debug/app-host-debug.apk \
             "${{ steps.name.outputs.stem }}-host.apk"
          cp app/build/outputs/apk/compat/debug/app-compat-debug.apk \
             "${{ steps.name.outputs.stem }}-compat.apk"
          ls -l "${{ steps.name.outputs.stem }}"-*.apk

      # Uses the preinstalled GitHub CLI rather than a third-party action. A
      # release job holds contents:write, so it is the last place to take on a
      # supply-chain dependency that could rewrite the repository.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Automated build from the latest green CI run. Every protocol, voice,
          Android and on-device gate passed before this was published.

          ## What is new in this build

          **The car screen is panels now, and one of them is a real app.**

          - A **rail** across the top: settings, the microphone, and the
            layouts and apps *you* pinned. Nothing else.
          - **Panels** in any arrangement, any depth, edited on the car screen
            itself — settings there, then *Edit this layout* — and locked by
            default so a thumb on the dashboard cannot rearrange your car.
          - An **App panel** that shows a real app running, with touch going
            back to it. Opening an app no longer replaces the whole car screen.
          - **Themes**: dark, true black or light, with six accents including
            none at all.
          - The link **comes up on its own** when the car's Bluetooth appears,
            and starts nothing on the phone's screen while doing it.

          Apps render from the phone's own screen by default — nothing to turn
          on in Developer options, nothing to toggle per drive. The simulated
          display is still there if you want a car-shaped picture, under
          settings → Apps and panels, along with fit-or-crop for the panel.

          ## Before you install this

          **The car link itself is proven; most of what is above is not.** A
          2021 Chevrolet Infotainment 3 unit has completed the whole bring-up
          and displayed the phone screen — 2754 frames, 4 dropped, video focus
          granted. Everything in the list above compiles, passes its unit and
          on-device tests, and has had at most one drive behind it. Expect to
          find things.

          Two things that car settled, both fixed in the app:

          - **The certificate question is answered.** It refuses the expired
            phone-role certificate and accepts `Android-Auto-Internal`, which is
            valid to 2048 and signed by the same CA. Headway rotates to it on
            its own in two attempts. **You no longer need to move the car's
            clock**, so Google's Android Auto keeps working.
          - **That unit announces `access_point_type=STATIC`** — it assigns no
            addresses, so a static IP on a saved car network is simply the
            correct configuration for it, not a workaround. If your log says
            STATIC, stop chasing DHCP.

          **If you run a VPN**, Headway now binds itself to the car's network so
          the link works through it. If it still fails, your VPN is set to block
          connections that do not go through it: turn off "Block connections
          without VPN", or exclude Headway in the VPN app.

          See `PROGRESS.md` for the evidence behind each phase and `BLOCKERS.md`
          for what is known to be missing.

          ## If it fails in the car

          Export the log from inside the app and read the `rx`/`tx` lines. The
          whole RFCOMM conversation is logged in both directions with hex, which
          is what made the last real-car bug findable at all. Every constant is
          cited in `docs/protocol-notes.md`, so a captured frame can be decoded
          by hand against it.

          ## Updating

          Headway can update itself: **Check for updates** at the bottom of the
          main screen. It only ever checks when you press it — nothing runs in
          the background, and the car link never touches the internet.

          **Coming from build 19 or earlier, uninstall Headway first.** Those
          builds were each signed with a throwaway key generated on the CI runner
          that built them, so no two were signed alike and Android refused every
          upgrade with "App not installed". Builds from 20 onward share one
          stable key, so this is a one-time uninstall — and the reason the
          in-app updater can work at all.

          ## Which APK to download

          Two are attached. They are the same app; they differ in two lines of
          manifest.

          - **`-host.apk` — take this one.** It declares
            `android.car.permission.TEMPLATE_RENDERER` and owns the
            `androidx.car.app.connection` authority, which is what lets
            third-party car apps draw their own interface on the car screen.
          - **`-compat.apk` — take this one if `-host.apk` says "App not
            installed".** A permission name has one definer per device and a
            provider authority one owner, so if something else on your phone
            already holds either — realistically Google's Android Auto — the
            host APK cannot install at all. The compat APK claims neither and
            installs anywhere. You lose only the car-app host; the car link,
            video, touch, audio, voice, maps, phone and media are identical.

          Same package name and same signing key, so you can switch between them
          later with no uninstall and no data loss. The in-app updater keeps you
          on whichever you installed.

          ## About these APKs

          They are **debug** builds, and deliberately so: protocol frame logging
          is compiled in, which is what makes a first-connection failure
          diagnosable from the in-app log export.

          It is signed with the development key committed in `signing/`, which is
          public and protects nothing — it exists to be *stable*, not secret, in
          exactly the way the platform-wide Android debug key is. A real
          distribution key belongs in CI secrets; the build picks one up from
          `HEADWAY_KEYSTORE` without a code change.
          NOTES
          {
            echo ""
            echo "Commit: \`${{ steps.name.outputs.sha }}\`"
          } >> notes.md

          gh release create "${{ steps.name.outputs.tag }}" \
            "${{ steps.name.outputs.stem }}-host.apk" \
            "${{ steps.name.outputs.stem }}-compat.apk" \
            --title "Headway ${{ steps.name.outputs.version }} (build ${{ github.run_number }})" \
            --notes-file notes.md \
            --prerelease \
            --target "$GITHUB_SHA"
